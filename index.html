<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teddy KICKS & DRIP - Sebokeng</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;600;800&display=swap');
*{margin:0;box-sizing:border-box}
body{font-family:'Poppins',Arial;background:#0f0f0f;color:white}
.top{background:linear-gradient(180deg,#ff2e7e 0%,#ff2e7e 55%,#c2185b 75%,#0f0f0f 100%);padding:38px 20px 40px;text-align:center}
.logo{background:white;color:#ff2e7e;padding:6px 18px;border-radius:20px;font-family:'Anton';letter-spacing:3px;display:inline-block;box-shadow:0 4px 15px rgba(0,0,0,0.2)}
h1{font-family:'Anton';font-size:52px;line-height:0.9;margin:12px 0;text-shadow:0 4px 20px rgba(0,0,0,0.25)}
h1 span{font-family:cursive;font-weight:100;font-size:30px;display:block;color:#ffe1ec}
.tag{font-weight:600;letter-spacing:1px;font-size:14px}
.badges{margin:14px 0}
.badge{background:#000;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;margin:4px;border:1px solid #333;display:inline-block}
.btn{background:#25D366;color:white;padding:15px 30px;border-radius:30px;text-decoration:none;font-weight:800;display:inline-block;margin-top:12px;box-shadow:0 8px 20px rgba(0,0,0,0.35)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;overflow:hidden}
.card img{width:100%;height:300px;object-fit:cover;display:block;background:#fff}
.info{padding:16px;text-align:left}
.info h2{font-size:19px}
.info p{color:#bbb;font-size:13px;margin:6px 0 10px;line-height:1.5}
.price{background:#ff2e7e;padding:6px 14px;border-radius:20px;font-weight:800}
.old{color:#777;text-decoration:line-through;font-size:13px;margin-left:8px}
.order{display:block;background:#25D366;color:white;text-align:center;padding:13px;border-radius:30px;text-decoration:none;font-weight:800;margin-top:14px}
.tag2{font-size:11px;font-weight:800;padding:4px 8px;border-radius:10px;display:inline-block}
.service-title{font-family:'Anton';font-size:28px;text-align:center;margin:35px 0 5px;letter-spacing:1px}
.service-title span{color:#ff8fb3}
.service-sub{text-align:center;color:#999;font-size:14px;margin-bottom:15px}
.service-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.s-box{background:#1e1e1e;border:1px solid #333;padding:18px 14px;border-radius:18px;text-align:left}
.s-box b{font-size:24px}
.s-box h3{font-size:14px;margin:8px 0 4px}
.s-box p{font-size:12px;color:#aaa;line-height:1.4}
.drip-title{font-family:'Anton';font-size:28px;margin:35px 0 5px;letter-spacing:1px;text-align:center}
.drip-title span{color:#ff2e7e}

.swipe{display:flex;gap:14px;overflow-x:auto;padding:10px 4px 18px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.swipe::-webkit-scrollbar{display:none}
.drip-card{min-width:78%;max-width:78%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;overflow:hidden;scroll-snap-align:center;flex-shrink:0}
.drip-card img{width:100%;height:280px;object-fit:cover;background:#222;display:block}
@media(min-width:768px){
  h1{font-size:72px}
  .grid{grid-template-columns:1fr 1fr 1fr}
  .card img{height:260px}
  .service-grid{grid-template-columns:1fr 1fr 1fr 1fr}
  .top{padding:55px 20px 55px}
  /* DESKTOP FIX - no swipe, 3 in a row */
  .swipe{display:grid;grid-template-columns:1fr 1fr 1fr;overflow:visible;scroll-snap-type:none}
  .drip-card{min-width:100%;max-width:100%}
  .drip-card img{height:280px}
}
.card{transition:transform 0.3s,box-shadow 0.3s}
